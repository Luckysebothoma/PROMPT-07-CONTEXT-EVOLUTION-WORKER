# Pure worker: no published ports. Same external network as Day 4.
services:
  worker:
    build: .
    image: ai_gateway_7_of_10_context_evolution:latest
    container_name: ai_gateway_7_of_10_worker
    env_file: .env
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/day7.heartbeat');process.exit(Date.now()-s.mtimeMs<180000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ai-gateway-net

networks:
  ai-gateway-net:
    external: true
